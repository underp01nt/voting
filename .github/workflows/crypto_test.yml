name: Crypto tests
on:
  push:
    branches: 
      - web-implementation
    paths:
      - services/crypto.py
jobs:
  crypto_test:
    name: Test encryption/decryption methods
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - name: Run tests
        run: |
          python -m pytest tests/crypto/
